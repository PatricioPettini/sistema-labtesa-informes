<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LABTESA · Lab-Informes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ===================== TOKENS ===================== */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fafbfc; --surface-3:#f0f2f5;
  --border:#e3e5ea; --border-strong:#d4d7de;
  --text:#1a1d23; --text-2:#3a414c; --text-3:#6b7280; --text-4:#9aa1ad;
  --accent:#1e6091; --accent-hover:#154a72; --accent-soft:#e7f0f7; --accent-soft-2:#d4e4f0;
  --success:#0d7a5f; --success-soft:#e3f3ee;
  --warning:#b45309; --warning-soft:#fdf0e3;
  --danger:#b3261e; --danger-soft:#fbe9e7;
  --info:#1e6091; --info-soft:#e7f0f7;
  --radius:9px; --radius-sm:6px; --radius-lg:13px;
  --shadow-sm:0 1px 2px rgba(20,30,50,.06), 0 1px 1px rgba(20,30,50,.04);
  --shadow-md:0 4px 14px rgba(20,30,50,.08), 0 1px 3px rgba(20,30,50,.05);
  --shadow-lg:0 18px 50px rgba(20,30,50,.18), 0 4px 12px rgba(20,30,50,.10);
  --font:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sidebar-w:248px;
  /* Banner de vencimientos (Trello). Se re-tinta en dark. */
  --banner-bg:#fff8f2; --banner-border:#ffd6b0; --banner-title:#7a3a00;
  --banner-btn-bg:#ffffff; --banner-btn-border:#d4a875;
}
/* Modo oscuro: se activa con <html data-theme="dark">. Todos los componentes
   usan var(--…), así que sobrescribiendo los tokens acá se tinta la app entera. */
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1216; --surface:#181c22; --surface-2:#1f242c; --surface-3:#262c35;
  --border:#2c333d; --border-strong:#3a424e;
  --text:#e8ebef; --text-2:#c3c8d0; --text-3:#8a929e; --text-4:#5d6572;
  --accent:#4ea1e0; --accent-hover:#6fb6eb; --accent-soft:#1a3350; --accent-soft-2:#254566;
  --success:#3ecf8e; --success-soft:#123028;
  --warning:#f0a35c; --warning-soft:#3a2612;
  --danger:#f47472; --danger-soft:#3a1815;
  --info:#4ea1e0; --info-soft:#1a3350;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.25);
  --shadow-md:0 4px 14px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.30);
  --shadow-lg:0 18px 50px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.40);
  --banner-bg:#2a1f13; --banner-border:#4a3520; --banner-title:#e8a870;
  --banner-btn-bg:#1f242c; --banner-btn-border:#4a3520;
}
html[data-theme="dark"] img[src*=".svg"]{filter:brightness(.9);}
html[data-theme="dark"] .brand-logo{filter:brightness(1.6) contrast(.9);}

/* ============================================================================
 * DARK MODE — Overrides forzados para inline styles de los forms de ensayo.
 * Muchos forms (impacto, tracción, plegado, etc.) tienen colores hardcoded
 * (background:#fff, border:#333, background:#e6e6e6, color:#111, etc.) en
 * estilos inline React. Como los inline styles ganan sobre CSS común, usamos
 * `!important` para forzar contraste correcto en dark sin refactorizar cada form.
 * Los selectores están acotados a inputs/tablas/labels/headings del área ensayo.
 * ========================================================================== */
html[data-theme="dark"] input[type="text"],
html[data-theme="dark"] input[type="number"],
html[data-theme="dark"] input[type="search"],
html[data-theme="dark"] input:not([type]),
html[data-theme="dark"] textarea,
html[data-theme="dark"] select{
  background:var(--surface-2) !important;
  color:var(--text) !important;
  border-color:var(--border-strong) !important;
}
html[data-theme="dark"] input::placeholder,
html[data-theme="dark"] textarea::placeholder{color:var(--text-4) !important;}

/* Tablas: bordes claros → oscuros. Aplica solo a tablas dentro del contenido
   principal (no toca la sidebar ni componentes de UI ya theme-aware). */
html[data-theme="dark"] .main table th,
html[data-theme="dark"] .main table td{
  border-color:var(--border-strong) !important;
  color:var(--text) !important;
}
html[data-theme="dark"] .main table th{background:var(--surface-3) !important;}

/* Cabeceras y sub-cabeceras grises hardcoded en los forms (#e6e6e6 / #f0f0f0
   / #fafafa). Cualquier fondo gris claro adentro del main pasa a var(--surface-3). */
html[data-theme="dark"] .main [style*="background: rgb(230, 230, 230)"],
html[data-theme="dark"] .main [style*="background:#e6e6e6"],
html[data-theme="dark"] .main [style*="background: #e6e6e6"],
html[data-theme="dark"] .main [style*="background: rgb(240, 240, 240)"],
html[data-theme="dark"] .main [style*="background:#f0f0f0"],
html[data-theme="dark"] .main [style*="background: #f0f0f0"],
html[data-theme="dark"] .main [style*="background: rgb(244, 244, 244)"],
html[data-theme="dark"] .main [style*="background:#f4f4f4"],
html[data-theme="dark"] .main [style*="background: #f4f4f4"],
html[data-theme="dark"] .main [style*="background: rgb(250, 250, 250)"],
html[data-theme="dark"] .main [style*="background:#fafafa"],
html[data-theme="dark"] .main [style*="background: #fafafa"]{
  background:var(--surface-3) !important;
  color:var(--text) !important;
}

/* Fondos blancos hardcoded (#fff / #ffffff / white) → superficie oscura. */
html[data-theme="dark"] .main [style*="background:#fff"],
html[data-theme="dark"] .main [style*="background: #fff"],
html[data-theme="dark"] .main [style*="background:#ffffff"],
html[data-theme="dark"] .main [style*="background: #ffffff"],
html[data-theme="dark"] .main [style*="background:white"],
html[data-theme="dark"] .main [style*="background: white"],
html[data-theme="dark"] .main [style*="background: rgb(255, 255, 255)"]{
  background:var(--surface) !important;
}

/* Textos negros / muy oscuros → texto claro. */
html[data-theme="dark"] .main [style*="color: rgb(17, 17, 17)"],
html[data-theme="dark"] .main [style*="color:#111"],
html[data-theme="dark"] .main [style*="color: #111"],
html[data-theme="dark"] .main [style*="color: rgb(51, 51, 51)"],
html[data-theme="dark"] .main [style*="color:#333"],
html[data-theme="dark"] .main [style*="color: #333"],
html[data-theme="dark"] .main [style*="color: rgb(85, 85, 85)"],
html[data-theme="dark"] .main [style*="color:#555"],
html[data-theme="dark"] .main [style*="color: #555"]{
  color:var(--text-2) !important;
}
html[data-theme="dark"] .main [style*="color: rgb(102, 102, 102)"],
html[data-theme="dark"] .main [style*="color:#666"],
html[data-theme="dark"] .main [style*="color: #666"],
html[data-theme="dark"] .main [style*="color: rgb(136, 136, 136)"],
html[data-theme="dark"] .main [style*="color:#888"],
html[data-theme="dark"] .main [style*="color: #888"],
html[data-theme="dark"] .main [style*="color: rgb(153, 153, 153)"],
html[data-theme="dark"] .main [style*="color:#999"],
html[data-theme="dark"] .main [style*="color: #999"]{
  color:var(--text-3) !important;
}

/* Bordes de inputs / celdas de tabla con border:#333 / #999 / #bbb hardcoded. */
html[data-theme="dark"] .main [style*="border: 1px solid rgb(51, 51, 51)"],
html[data-theme="dark"] .main [style*="border:1px solid #333"],
html[data-theme="dark"] .main [style*="border: 1px solid #333"],
html[data-theme="dark"] .main [style*="border: 1px solid rgb(153, 153, 153)"],
html[data-theme="dark"] .main [style*="border:1px solid #999"],
html[data-theme="dark"] .main [style*="border: 1px solid #999"],
html[data-theme="dark"] .main [style*="border: 1px solid rgb(187, 187, 187)"],
html[data-theme="dark"] .main [style*="border:1px solid #bbb"],
html[data-theme="dark"] .main [style*="border: 1px solid #bbb"]{
  border-color:var(--border-strong) !important;
}

/* Inputs nativos en dark: color-scheme ya hace el resto (calendarios/pickers). */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* ── Modo PRINT (puppeteer captura registros digitales) ─────────────── */
/* Layout limpio: sin sidebar, breadcrumb ni botones — solo el form del ensayo,
   centrado y sin overflow. Puppeteer captura A4 con scale=0.65 así que el
   sheet natural (1123px) entra cómodo. */
body.print-mode{background:#fff;overflow-x:hidden;}
body.print-mode .sidebar,
body.print-mode .breadcrumb,
body.print-mode .page-head-actions,
body.print-mode .otbanner,
body.print-mode .plantillas-bar,
body.print-mode .variant-block,
body.print-mode .page-head .page-title,
body.print-mode .form-actions,
body.print-mode .firma-panel,
body.print-mode .ensayo-firma-chip,
body.print-mode .add-ensayo-grid,
body.print-mode .breadcrumb-sep{display:none !important;}
body.print-mode .app-print{background:#fff;min-height:0;}
body.print-mode .main-print{margin:0 !important;padding:0 !important;background:#fff;}
body.print-mode .main-inner-print{max-width:1200px;margin:0 auto;padding:8px;}
body.print-mode .page,body.print-mode .page-wide{padding:0 !important;max-width:100% !important;}
body.print-mode .page-head{margin:0 0 8px !important;}
body.print-mode input,body.print-mode textarea,body.print-mode select{
  background:transparent !important;pointer-events:none;
}
/* Forzar que las tablas del form respeten el ancho del sheet y no se salgan. */
body.print-mode table{max-width:100% !important;}
body.print-mode .stats-card,body.print-mode .card{page-break-inside:avoid;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
.mono{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:-.01em;}
.dim{color:var(--text-3);} .sm{font-size:12.5px;}
::selection{background:var(--accent-soft-2);}
.req{color:var(--danger);}

/* ===================== LAYOUT ===================== */
.app{display:flex;min-height:100vh;}
.main{flex:1;min-width:0;margin-left:var(--sidebar-w);}
.main-inner{max-width:1600px;margin:0 auto;padding:30px 38px 80px;}
.page-narrow{max-width:760px;margin:0 auto;}
.page-mid{max-width:1040px;margin:0 auto;}
.page-wide{max-width:min(98vw, 1900px);margin:0 auto;}

/* ===================== SIDEBAR ===================== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30;}
.sidebar-brand{padding:22px 22px 18px;border-bottom:1px solid var(--border);}
.brand-logo{width:100%;max-width:160px;height:auto;display:block;}
.sidebar-sectlabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4);padding:20px 22px 8px;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:0 12px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text-2);
  font-weight:500;font-size:13.5px;position:relative;transition:background .14s,color .14s;}
.nav-item:hover{background:var(--surface-3);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
.nav-soon{margin-left:auto;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-4);
  background:var(--surface-3);padding:2px 6px;border-radius:20px;}
.sidebar-foot{margin-top:auto;padding:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:4px 6px;}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:12px;letter-spacing:.02em;flex-shrink:0;}
.sidebar-user-info{display:flex;flex-direction:column;line-height:1.25;}
.sidebar-user-name{font-weight:600;font-size:13px;}
.sidebar-user-role{font-size:11.5px;color:var(--text-3);}
.sidebar-reset{display:flex;align-items:center;gap:7px;justify-content:center;padding:7px;border:1px solid var(--border);
  background:var(--surface);border-radius:var(--radius-sm);color:var(--text-3);font-size:12px;font-weight:500;transition:.14s;}
.sidebar-reset:hover{background:var(--surface-3);color:var(--text-2);}

/* ===================== PAGE HEAD ===================== */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:6px 0 22px;}
.page-title{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0;}
.page-sub{margin:3px 0 0;color:var(--text-3);font-size:13.5px;}
.page-head-actions{display:flex;gap:9px;flex-shrink:0;align-items:center;}
.detail-title{display:flex;align-items:center;gap:12px;}
.detail-title .page-title{font-size:25px;}
.ensayo-head-ic{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ===================== BUTTONS ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--radius-sm);
  font-weight:600;font-size:13px;line-height:1;transition:background .14s,border-color .14s,color .14s,box-shadow .14s,transform .05s;white-space:nowrap;}
.btn:active{transform:translateY(.5px);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-md{padding:9px 14px;} .btn-sm{padding:6px 11px;font-size:12.5px;} .btn-block{width:100%;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);}
.btn-soft{background:var(--accent-soft);color:var(--accent);}
.btn-soft:hover:not(:disabled){background:var(--accent-soft-2);}
.btn-default{background:var(--surface);color:var(--text-2);border-color:var(--border-strong);}
.btn-default:hover:not(:disabled){background:var(--surface-3);}
.btn-ghost{background:transparent;color:var(--text-2);}
.btn-ghost:hover:not(:disabled){background:var(--surface-3);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover:not(:disabled){background:#8f1e17;}
.btn-warning{background:var(--warning);color:#fff;}
.btn-warning:hover:not(:disabled){background:#8a3f07;}
.btn-spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===================== STATS SCREEN ===================== */
.stats-kpi{transition:transform .15s ease, box-shadow .15s ease;}
.stats-kpi:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,.06);}
.stats-card{transition:box-shadow .15s ease;}
.stats-card:hover{box-shadow:0 4px 14px rgba(15,23,42,.05);}
.stats-bar > div:nth-child(2){transition:transform .15s ease;transform-origin:center bottom;}
.stats-bar:hover > div:nth-child(2){transform:scaleY(1.02);}

/* ===================== CARD ===================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:20px;margin-bottom:16px;}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:-2px 0 16px;}
.card-head-l{display:flex;align-items:center;gap:11px;}
.card-head-icon{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.card-title{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em;}
.card-sub{font-size:12.5px;color:var(--text-3);margin:1px 0 0;}
.table-card{padding:0;overflow:hidden;}

/* ===================== TOOLBAR / TABS ===================== */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow-sm);}
.tab{display:flex;align-items:center;gap:7px;padding:6px 13px;border:none;background:transparent;border-radius:var(--radius-sm);
  font-weight:500;font-size:13px;color:var(--text-3);transition:.14s;}
.tab:hover{color:var(--text);background:var(--surface-3);}
.tab.active{background:var(--accent);color:#fff;font-weight:600;}
.tab-count{font-size:11px;font-weight:600;padding:1px 6px;border-radius:20px;background:rgba(0,0,0,.07);}
.tab.active .tab-count{background:rgba(255,255,255,.22);}
.toolbar-r{flex:1;min-width:240px;max-width:380px;margin-left:auto;}

/* ===================== SEARCH INPUT ===================== */
.search-input{position:relative;display:flex;align-items:center;}
.search-icon{position:absolute;left:12px;color:var(--text-4);pointer-events:none;}
.search-input .input{padding-left:35px;padding-right:32px;width:100%;}
.search-clear{position:absolute;right:8px;border:none;background:transparent;color:var(--text-4);display:flex;padding:3px;border-radius:5px;}
.search-clear:hover{background:var(--surface-3);color:var(--text-2);}

/* ===================== FIELDS / INPUTS ===================== */
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field-label{font-size:12.5px;font-weight:600;color:var(--text-2);}
.field-hint{font-size:11.5px;color:var(--text-3);}
.field-span-2{grid-column:span 2;} .field-span-3{grid-column:span 3;} .field-span-4{grid-column:span 4;}
.input{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-sm);
  padding:8px 11px;font-family:inherit;font-size:13.5px;color:var(--text);transition:border-color .14s,box-shadow .14s;}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.input::placeholder{color:var(--text-4);}
.input:disabled{background:var(--surface-3);color:var(--text-3);cursor:not-allowed;}
.input.mono{font-family:var(--mono);font-size:13px;}
.input.invalid{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
.textarea{resize:vertical;line-height:1.55;min-height:64px;}
.select-wrap{position:relative;}
.select-wrap .input.select,.select-wrap select{appearance:none;-webkit-appearance:none;padding-right:32px;width:100%;cursor:pointer;}
.select-chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}

.form-grid{display:grid;gap:14px 16px;margin-bottom:14px;}
.form-grid:last-child{margin-bottom:0;}
.form-grid.cols-1{grid-template-columns:1fr;}
.form-grid.cols-2{grid-template-columns:1fr 1fr;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.form-grid.cols-4{grid-template-columns:repeat(4,1fr);}

/* ===================== CHIPS ===================== */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;line-height:1.3;white-space:nowrap;}
.chip-sm{font-size:11px;padding:2px 7px;}
.chip-neutral{background:var(--surface-3);color:var(--text-2);}
.chip-success{background:var(--success-soft);color:var(--success);}
.chip-warning{background:var(--warning-soft);color:var(--warning);}
.chip-danger{background:var(--danger-soft);color:var(--danger);}
.chip-info{background:var(--info-soft);color:var(--info);}
.ensayo-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--text-2);
  background:var(--surface-3);border:1px solid var(--border);padding:3px 8px 3px 6px;border-radius:6px;white-space:nowrap;}
.ensayo-chip svg{color:var(--accent);}
.ensayo-more{font-size:11px;font-weight:600;color:var(--text-3);align-self:center;}

/* ===================== OT TABLE ===================== */
.ot-table{width:100%;border-collapse:collapse;}
.ot-table th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);
  padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);}
.ot-table td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
.ot-row{cursor:pointer;transition:background .12s;}
.ot-row:hover{background:var(--accent-soft);}
.ot-row:last-child td{border-bottom:none;}
.ot-num{font-weight:600;font-size:14px;color:var(--accent);}
.cell-cliente{display:flex;flex-direction:column;gap:1px;}
.cell-cliente-name{font-weight:500;}
.cell-cliente-muestra{font-size:12px;color:var(--text-3);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cell-estado{display:flex;gap:5px;align-items:center;}
.cell-ensayos{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.row-chev{color:var(--text-4);}
.ot-row:hover .row-chev{color:var(--accent);}
.row-menu-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-4);border-radius:6px;transition:.12s;}
.row-menu-btn:hover{background:var(--surface-3);color:var(--text);}
.ot-row:hover .row-menu-btn{color:var(--text-2);}
.row-menu{position:fixed;z-index:120;min-width:160px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:5px;display:flex;flex-direction:column;gap:1px;animation:pop .14s cubic-bezier(.2,.8,.3,1);}
.row-menu-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border:none;background:transparent;border-radius:5px;
  font-size:13px;font-weight:500;color:var(--text-2);text-align:left;transition:.12s;}
.row-menu-item:hover{background:var(--surface-3);color:var(--text);}
.row-menu-item.danger{color:var(--danger);}
.row-menu-item.danger:hover{background:var(--danger-soft);}

/* ===================== DETAIL ===================== */
.detail-grid{display:grid;grid-template-columns:1fr 410px;gap:20px;align-items:start;}
.detail-right{position:sticky;top:24px;}
.readonly-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.ro-field{display:flex;flex-direction:column;gap:2px;}
.ro-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-4);}
.ro-value{font-size:13.5px;color:var(--text);font-weight:500;}
.trello-link{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;font-weight:600;color:var(--accent);}
.trello-link:hover{text-decoration:underline;}
.muestra-text{font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--text-2);margin:0;white-space:pre-wrap;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}

/* ensayo list */
.add-ensayo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0 16px;margin-bottom:14px;border-bottom:1px dashed var(--border);}
.add-ensayo-btn{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);text-align:left;transition:.14s;position:relative;}
.add-ensayo-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.add-ensayo-ic{width:30px;height:30px;border-radius:7px;background:var(--surface-3);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.add-ensayo-btn:hover .add-ensayo-ic{background:#fff;}
.add-ensayo-label{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.25;}
.add-ensayo-soon{position:absolute;top:6px;right:7px;font-size:9px;font-weight:700;text-transform:uppercase;color:var(--warning);background:var(--warning-soft);padding:1px 5px;border-radius:10px;}
.ensayo-empty{font-size:13px;color:var(--text-3);padding:8px 2px;}
.ensayo-list{display:flex;flex-direction:column;gap:8px;}
.ensayo-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);transition:.14s;}
.ensayo-item:hover{border-color:var(--border-strong);background:var(--surface-2);}
.ensayo-item-ic{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ensayo-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.ensayo-item-title{font-weight:600;font-size:13.5px;}
.ensayo-item-meta{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ensayo-item-actions{display:flex;gap:3px;}
.icon-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-3);border-radius:6px;transition:.14s;}
.icon-btn:hover{background:var(--surface-3);color:var(--text);}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);}
.row-actions{display:flex;gap:2px;justify-content:flex-end;}

/* report card */
.report-card{background:var(--surface-2);}
.pre-toggle-wrap{padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);margin-bottom:14px;}
.pre-toggle{display:inline-flex;align-items:flex-start;gap:11px;cursor:pointer;}
.pre-toggle-texts{display:flex;flex-direction:column;}
.pre-toggle input{display:none;}
.pre-toggle-box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;margin-top:1px;transition:.14s;}
.pre-toggle input:checked + .pre-toggle-box{background:var(--warning);border-color:var(--warning);}
.pre-toggle-label{display:block;font-weight:600;font-size:13px;}
.pre-toggle-hint{display:block;font-size:11.5px;color:var(--text-3);}
.report-actions{display:flex;flex-direction:column;gap:9px;}

/* ===================== QA PANEL ===================== */
.qa-panel{margin-top:16px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);}
.qa-head{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;background:var(--surface-2);}
.qa-summary{margin-left:auto;}
.qa-group{display:flex;flex-direction:column;}
.qa-line{display:flex;align-items:flex-start;gap:8px;padding:9px 13px;font-size:12.5px;line-height:1.4;border-bottom:1px solid var(--border);}
.qa-line svg{flex-shrink:0;margin-top:1px;}
.qa-danger .qa-line{color:var(--danger);background:var(--danger-soft);}
.qa-warning .qa-line{color:var(--warning);background:var(--warning-soft);}
.qa-success .qa-line{color:var(--success);background:var(--success-soft);}
.qa-group:last-child .qa-line:last-child{border-bottom:none;}

/* ===================== EMPTY / BREADCRUMB ===================== */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:54px 20px;}
.empty-icon{width:58px;height:58px;border-radius:50%;background:var(--surface-3);color:var(--text-3);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.empty h3{margin:0 0 4px;font-size:16px;font-weight:600;}
.empty p{margin:0 0 16px;color:var(--text-3);font-size:13.5px;max-width:340px;}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:14px;}
.crumb{color:var(--text-3);font-weight:500;}
.crumb:not(.current):hover{color:var(--accent);}
.crumb.current{color:var(--text);font-weight:600;}
.crumb-sep{color:var(--text-4);}

/* ===================== FORM SECTION / FOOTER ===================== */
.form-sec{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm);}
.form-sec-head{display:flex;align-items:center;gap:9px;width:100%;padding:13px 16px;border:none;background:var(--surface-2);
  font-weight:600;font-size:13.5px;color:var(--text);text-align:left;border-bottom:1px solid transparent;}
.form-sec-head:hover{background:var(--surface-3);}
.form-sec-chev{color:var(--text-3);transition:transform .18s;}
.form-sec-chev.closed{transform:rotate(-90deg);}
.form-sec-body{padding:18px 16px;}
.ensayo-form{margin-top:18px;}

.form-footer{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
.form-footer-r{display:flex;align-items:center;gap:14px;}
.kbd-hint{display:flex;align-items:center;gap:3px;color:var(--text-4);font-size:12px;}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--text-3);}

/* ===================== TRELLO ===================== */
.trello-card{border-style:dashed;background:var(--surface-2);}
.trello-row{display:flex;gap:10px;}
.trello-input{flex:1;}
.trello-picker{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
.trello-picker-label{font-size:12.5px;color:var(--text-2);font-weight:500;margin:0 0 10px;}
.trello-options{display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow-y:auto;padding-right:4px;}
.trello-opt{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);text-align:left;transition:.14s;}
.trello-opt:hover{border-color:var(--accent);}
.trello-opt.active{border-color:var(--accent);background:var(--accent-soft);}
.trello-opt-ot{font-weight:600;color:var(--accent);font-size:13.5px;}
.trello-opt-muestra{flex:1;font-size:13px;color:var(--text-2);}
.trello-opt.active svg{color:var(--accent);margin-left:auto;}

/* ===================== VARIANT / EQUIPO / RESULT PICKER ===================== */
.variant-block{margin-bottom:6px;}
.variant-block-label,.variant-block-label{font-size:12.5px;font-weight:600;color:var(--text-2);display:block;margin-bottom:8px;}
.variant-toggle{display:flex;gap:10px;flex-wrap:wrap;}
.variant-pill{display:flex;flex-direction:column;gap:2px;align-items:flex-start;position:relative;padding:11px 18px 11px 15px;min-width:180px;
  border:1.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);text-align:left;transition:.14s;}
.variant-pill:hover{border-color:var(--accent);}
.variant-pill.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft);}
.variant-pill-label{font-weight:600;font-size:13.5px;color:var(--text);}
.variant-pill-sub{font-size:11.5px;color:var(--text-3);}
.variant-pill.active .variant-pill-sub{color:var(--accent);}
.variant-pill-check{position:absolute;top:9px;right:9px;color:var(--accent);}
.equipo-toggle{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.equipo-pill{display:flex;align-items:center;gap:9px;padding:9px 14px;border:1.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);font-weight:500;font-size:13px;color:var(--text-2);transition:.14s;}
.equipo-pill:hover{border-color:var(--accent);}
.equipo-pill.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}
.equipo-radio{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-strong);transition:.14s;}
.equipo-radio.on{border-color:var(--accent);border-width:4px;}
.equipo-boxes{display:flex;flex-direction:column;gap:6px;}
.equipo-boxes-extra-sep{display:flex;align-items:center;gap:8px;margin:8px 4px 4px;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
.equipo-boxes-extra-sep::before,.equipo-boxes-extra-sep::after{content:"";flex:1;height:1px;background:var(--border);}
.equipo-boxes-sede{background:var(--surface-3);color:var(--text-2);padding:1px 8px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.02em;}
.equipo-boxes-sede.sede-caba{background:var(--accent-soft);color:var(--accent);}
.equipo-boxes-sede.sede-neuquen{background:#fef3c7;color:#92400e;}
.equipo-boxes-sede.sede-ambas{background:var(--success-soft);color:var(--success);}
.equipo-box.equipo-box-extra{border-style:dashed;}
.equipo-box.equipo-box-extra.active{border-style:solid;}
.equipo-box{display:flex;align-items:center;gap:10px;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:13px;color:var(--text-2);cursor:pointer;transition:.12s;user-select:none;}
.equipo-box:hover{border-color:var(--accent);}
.equipo-box.active{border-color:var(--accent);background:var(--accent-soft);color:var(--text-1);}
.equipo-box-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s;}
.equipo-box-check.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.field-checkbox{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text-2);}
.field-checkbox input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
.result-picker{display:flex;flex-direction:column;gap:8px;}
.result-opt{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);font-weight:500;font-size:13.5px;color:var(--text-2);text-align:left;transition:.14s;}
.result-opt:hover{border-color:var(--accent);}
.result-opt.active.ok{border-color:var(--success);background:var(--success-soft);color:var(--success);}
.result-opt.active.warn{border-color:var(--warning);background:var(--warning-soft);color:var(--warning);}
.result-opt-radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.result-opt.active.ok .result-opt-radio{background:var(--success);border-color:var(--success);}
.result-opt.active.warn .result-opt-radio{background:var(--warning);border-color:var(--warning);}

/* ===================== DATA TABLE EDITABLE ===================== */
.results-sec{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden;margin-top:4px;}
.results-sec-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);
  border-bottom:1px solid var(--border);}
.results-sec-head h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px;color:var(--text);letter-spacing:-.01em;}
.results-sec-head h3::before{content:"";display:inline-block;width:3px;height:14px;border-radius:2px;background:var(--accent);}
.opt-tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);background:var(--surface-3);padding:3px 8px;border-radius:10px;border:1px solid var(--border);}
.results-count{font-size:11.5px;color:var(--text-3);font-weight:500;background:var(--surface);border:1px solid var(--border);padding:3px 9px;border-radius:12px;}
.dt-wrap{padding:0;background:var(--surface);}
.dt-scroll{overflow-x:auto;}
.dt{width:100%;border-collapse:separate;border-spacing:0;}
.dt thead th{position:sticky;top:0;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);
  padding:11px 12px;border-bottom:1px solid var(--border-strong);background:var(--surface-2);white-space:nowrap;}
.dt thead th:not(:last-child){border-right:1px solid var(--border);}
.dt-idx{width:38px;text-align:center;color:var(--text-4);font-size:11px;}
.dt-act{width:68px;text-align:center;}
.dt td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.dt tbody tr:last-child td{border-bottom:none;}
.dt td.dt-idx{text-align:center;color:var(--text-3);font-family:var(--mono);font-size:12px;font-weight:600;background:var(--surface-2);}
.dt tbody tr{transition:background .12s;}
.dt tbody tr:hover{background:var(--accent-soft);}
.dt tbody tr:hover td.dt-idx{background:var(--accent-soft-2);color:var(--accent);}
.dt-input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--text);transition:border-color .12s,box-shadow .12s,background .12s;}
.dt-input.num{font-family:var(--mono);font-size:12.5px;font-feature-settings:"tnum";letter-spacing:-.01em;text-align:right;}
.dt-input::placeholder{color:var(--text-4);font-weight:400;}
.dt-input:hover{border-color:var(--border-strong);}
.dt-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface);}
.dt-select select{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:7px 26px 7px 10px;font-family:inherit;font-size:12.5px;font-weight:500;appearance:none;-webkit-appearance:none;cursor:pointer;color:var(--text-2);transition:border-color .12s,box-shadow .12s;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='4 6 8 10 12 6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;background-size:14px;}
.dt-select select:hover{border-color:var(--border-strong);}

/* DynamicTable — tabla totalmente editable */
.dyn-table-wrap{padding:14px 16px;}
.dyn-table-actions{display:flex;gap:8px;margin-bottom:10px;}
.dyn-table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface);}
.dyn-table{width:100%;border-collapse:separate;border-spacing:0;}
.dyn-table th,.dyn-table td{padding:5px 6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:middle;}
.dyn-table th:last-child,.dyn-table td:last-child{border-right:none;}
.dyn-table tbody tr:last-child td{border-bottom:none;}
.dyn-th-label{background:var(--surface-2);font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;text-align:center;width:120px;}
.dyn-th{background:var(--surface-2);position:relative;}
.dyn-header-input{width:100%;border:none;background:transparent;font-weight:700;font-size:12px;color:var(--text);padding:6px 8px;text-transform:uppercase;letter-spacing:.04em;}
.dyn-header-input:focus{outline:none;background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent);}
.dyn-col-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;background:transparent;color:var(--text-4);font-size:13px;border-radius:4px;cursor:pointer;line-height:1;}
.dyn-col-del:hover{background:var(--accent-soft);color:var(--danger,#dc2626);}
.dyn-td-label{background:var(--surface-2);}
.dyn-rowlabel-input,.dyn-cell-input{width:100%;border:none;background:transparent;font-size:13px;color:var(--text);padding:6px 8px;font-family:inherit;}
.dyn-rowlabel-input{font-weight:600;color:var(--text-2);}
.dyn-rowlabel-input:focus,.dyn-cell-input:focus{outline:none;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent);}
.dyn-row-del-cell{width:34px;text-align:center;background:var(--surface-2);}
.dyn-row-del{border:none;background:transparent;color:var(--text-4);cursor:pointer;padding:4px;border-radius:4px;}
.dyn-row-del:hover{background:var(--accent-soft);color:var(--danger,#dc2626);}
.dyn-empty{text-align:center;color:var(--text-4);font-size:13px;padding:18px;font-style:italic;}
.dt-select select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.dt-select.ok select{color:var(--success);font-weight:600;} .dt-select.bad select{color:var(--danger);font-weight:600;}
.dt-empty{text-align:center;color:var(--text-3);font-size:13px;padding:32px 18px;background:var(--surface-2);}
.dt-empty-ic{display:flex;justify-content:center;margin-bottom:8px;color:var(--text-4);opacity:.7;}
.dt-cell-disabled{display:inline-block;width:100%;text-align:center;color:var(--text-4);font-size:13px;opacity:.45;font-style:italic;}
.dt-row-actions{display:flex;gap:2px;justify-content:center;}
.dt-iconbtn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;color:var(--text-4);border-radius:6px;transition:.12s;cursor:pointer;}
.dt-iconbtn:hover{background:var(--surface);border-color:var(--border-strong);color:var(--text-2);}
.dt-iconbtn.danger:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.dt-addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border:none;border-top:1px dashed var(--border-strong);background:var(--surface-2);
  color:var(--accent);font-weight:600;font-size:13px;letter-spacing:-.01em;cursor:pointer;transition:.15s;}
.dt-addrow:hover{background:var(--accent-soft);color:var(--accent-hover);}
.dt-addrow:active{background:var(--accent-soft-2);}
/* Vertical (parametros vs muestras) */
.dt.dt-vertical tbody td:first-child{background:var(--surface-2);font-weight:500;color:var(--text-2);font-size:12.5px;padding-left:14px;border-right:1px solid var(--border);}
.dt.dt-vertical tbody tr:hover td:first-child{background:var(--accent-soft);color:var(--text);}
.dt-muestra-head{display:flex;align-items:center;justify-content:space-between;gap:8px;text-transform:none;letter-spacing:0;}
.dt-muestra-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;background:var(--accent-soft);color:var(--accent);border-radius:14px;font-size:11.5px;font-weight:700;border:1px solid var(--accent-soft-2);}
.dt-muestra-chip-n{font-family:var(--mono);font-size:11px;}
/* Tabla compacta para químicos: filas más bajas + chip de símbolo de elemento */
.dt-compact tbody td{padding:3px 8px;}
.dt-compact tbody tr{height:30px;}
.dt-compact tbody td:first-child{font-size:12px;padding-left:10px;}
.dt-compact .dt-input{padding:4px 8px;font-size:12.5px;}
.dt-compact .dt-input.num{font-size:12px;}
.dt-elem{display:inline-flex;align-items:center;gap:9px;}
.dt-elem-sym{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 7px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:12.5px;font-weight:700;border-radius:5px;border:1px solid var(--accent-soft-2);letter-spacing:.01em;}
.dt-elem-name{font-weight:500;color:var(--text-2);font-size:12.5px;}
.dt-compact tbody tr:hover .dt-elem-sym{background:var(--accent);color:#fff;border-color:var(--accent);}
/* Sticky primera columna (parámetro/elemento) cuando la tabla scrollea horizontal */
.dt-vertical tbody td:first-child{position:sticky;left:0;z-index:1;}
.dt-vertical thead th:first-child{position:sticky;left:0;z-index:2;}
/* ===================== LADOS EDITOR ===================== */
.lados-editor{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--surface-2);}
.lados-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 18px;gap:6px;color:var(--text-3);background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius);}
.lados-empty-title{font-size:13.5px;font-weight:600;color:var(--text-2);margin-top:6px;}
.lados-empty-sub{font-size:12px;max-width:380px;}
.lado-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;}
.lado-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border-bottom:1px solid var(--border);}
.lado-num{display:inline-flex;align-items:center;padding:4px 11px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;border-radius:13px;letter-spacing:.02em;white-space:nowrap;}
.lado-name{flex:1;height:34px;font-weight:500;}
.lado-del{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--border);background:var(--surface);color:var(--text-4);border-radius:6px;cursor:pointer;transition:.12s;}
.lado-del:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.lados-addbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border:1px dashed var(--border-strong);background:var(--surface);
  color:var(--accent);font-weight:600;font-size:13px;letter-spacing:-.01em;cursor:pointer;border-radius:var(--radius);transition:.15s;}
.lados-addbtn:hover{background:var(--accent-soft);border-color:var(--accent);border-style:solid;}
/* ===================== PANEL OAA ===================== */
.oaa-card{padding:0;overflow:hidden;}
.oaa-card .card-head{padding:14px 18px;margin:0;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);}
.oaa-list{display:flex;flex-direction:column;}
.oaa-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);transition:background .12s;}
.oaa-row:last-child{border-bottom:none;}
.oaa-row:hover{background:var(--surface-2);}
.oaa-row.aplica{background:var(--success-soft);}
.oaa-row.aplica:hover{background:#daf0e9;}
.oaa-row-l{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}
.oaa-badge{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:26px;padding:0 8px;border-radius:6px;font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.02em;flex-shrink:0;}
.oaa-badge.on{background:var(--success);color:#fff;}
.oaa-badge.off{background:var(--surface-3);color:var(--text-4);}
.oaa-row-text{min-width:0;flex:1;}
.oaa-row-title{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em;}
.oaa-override-tag{font-size:10.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-left:6px;}
.oaa-ast-tag{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--danger);padding:1px 7px;border-radius:10px;margin-left:6px;letter-spacing:.02em;}
.oaa-row-motivo{font-size:11.5px;color:var(--text-3);margin-top:2px;line-height:1.35;}
.oaa-toggle{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.oaa-toggle input[type=checkbox]{position:absolute;opacity:0;width:0;height:0;}
.oaa-toggle-box{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.5px solid var(--border-strong);background:var(--surface);border-radius:5px;color:#fff;transition:.14s;}
.oaa-toggle:hover .oaa-toggle-box{border-color:var(--accent);}
.oaa-toggle-box.on{background:var(--accent);border-color:var(--accent);}
.oaa-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:var(--surface-2);border-top:1px solid var(--border);}
.oaa-foot-leyenda{font-size:11px;color:var(--text-3);line-height:1.4;}
.oaa-foot-status{font-size:11px;color:var(--text-3);white-space:nowrap;}
.oaa-err{padding:14px 18px;color:var(--danger);font-size:13px;}

/* ===================== OT BANNER ===================== */
.ot-banner{display:flex;align-items:center;gap:18px;padding:13px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:18px;}
.ot-banner-item{display:flex;flex-direction:column;gap:1px;min-width:0;}
.ot-banner-item.grow{flex:1;}
.ot-banner-k{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-4);}
.ot-banner-v{font-size:13.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ot-banner-div{width:1px;height:28px;background:var(--border);}

/* ===================== PENDING BANNER ===================== */
.pending-banner{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--warning-soft);color:var(--warning);
  border:1px solid #f0d9bd;border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;margin-bottom:16px;}

/* ===================== PHOTO GRID ===================== */
.photo-dropzone{display:flex;align-items:center;gap:12px;justify-content:center;padding:18px;border:1.5px dashed var(--border-strong);border-radius:var(--radius);
  background:var(--surface-2);color:var(--text-3);cursor:pointer;transition:.14s;}
.photo-dropzone:hover,.photo-dropzone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.dz-strong{font-weight:600;font-size:13px;color:var(--text-2);}
.photo-dropzone:hover .dz-strong{color:var(--accent);}
.dz-soft{font-size:13px;}
.photo-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px;}
.photo-thumb{position:relative;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);aspect-ratio:4/3;background:var(--surface-3);cursor:grab;}
.photo-thumb.dragging{opacity:.4;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-ord{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:5px;background:rgba(26,29,35,.78);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.photo-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(26,29,35,.5);opacity:0;transition:.14s;}
.photo-thumb:hover .photo-overlay{opacity:1;}
.photo-act{width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.92);color:var(--text);display:flex;align-items:center;justify-content:center;transition:.12s;}
.photo-act:hover{background:#fff;}
.photo-act.danger:hover{background:var(--danger);color:#fff;}
.photo-name{position:absolute;bottom:0;left:0;right:0;padding:4px 8px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(26,29,35,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.photo-hint{font-size:12.5px;color:var(--text-3);margin:12px 0 0;}

/* ===================== ENSAYO PHOTOS (con caption) ===================== */
.ensayo-photos-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.ensayo-photo-row{display:flex;gap:12px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);}
.ensayo-photo-thumb{width:80px;height:60px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);flex-shrink:0;}
.ensayo-photo-body{flex:1;display:flex;flex-direction:column;gap:8px;}
.ensayo-photo-actions{display:flex;gap:6px;}
.btn-mini{padding:4px 8px;border:1px solid var(--border);background:#fff;border-radius:4px;cursor:pointer;font-size:12px;}
.btn-mini:hover{background:var(--surface-3);}
.btn-mini:disabled{opacity:.4;cursor:not-allowed;}
.btn-mini.danger{color:var(--danger);}
.btn-mini.danger:hover{background:var(--danger);color:#fff;}

/* ===================== MODAL ===================== */
.modal-overlay{position:fixed;inset:0;background:rgba(20,28,42,.42);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;animation:fade .15s ease;}
@keyframes fade{from{opacity:0;}}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:430px;overflow:hidden;animation:pop .18s cubic-bezier(.2,.8,.3,1);}
.modal-wide{max-width:min(95vw, 1400px);}
.modal-wide .editor-body{padding:14px 16px;}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0;}
.modal-head h3{margin:0;font-size:16px;font-weight:600;}
.modal-x{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-3);border-radius:6px;}
.modal-x:hover{background:var(--surface-3);color:var(--text);}
.confirm{display:flex;gap:15px;padding:24px 22px 8px;}
.confirm-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.confirm-danger{background:var(--danger-soft);color:var(--danger);}
.confirm-warning{background:var(--warning-soft);color:var(--warning);}
.confirm-info{background:var(--accent-soft);color:var(--accent);}
.confirm-body h3{margin:0 0 5px;font-size:16px;font-weight:600;}
.confirm-body p{margin:0;color:var(--text-3);font-size:13.5px;line-height:1.5;}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;padding:18px 22px 20px;}

/* ===================== PHOTO EDITOR ===================== */
.editor-body{padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.editor-stage{position:relative;overflow:hidden;border-radius:var(--radius);background:#1a1d23;flex-shrink:0;user-select:none;}
.editor-img{position:absolute;user-select:none;-webkit-user-drag:none;pointer-events:none;}
.crop-overlay{position:absolute;background:rgba(0,0,0,.55);pointer-events:none;}
.crop-frame{position:absolute;box-shadow:0 0 0 1px #fff inset, 0 0 0 1px rgba(0,0,0,.4);cursor:move;}
.crop-frame::before,.crop-frame::after{content:"";position:absolute;pointer-events:none;}
.crop-frame::before{left:33.33%;right:33.33%;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.4);border-right:1px dashed rgba(255,255,255,.4);}
.crop-frame::after{top:33.33%;bottom:33.33%;left:0;right:0;border-top:1px dashed rgba(255,255,255,.4);border-bottom:1px dashed rgba(255,255,255,.4);}
.crop-handle{position:absolute;width:12px;height:12px;background:#fff;border:1px solid var(--accent,#3b82f6);border-radius:2px;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.crop-h-tl{left:-7px;top:-7px;cursor:nwse-resize;}
.crop-h-tr{right:-7px;top:-7px;cursor:nesw-resize;}
.crop-h-bl{left:-7px;bottom:-7px;cursor:nesw-resize;}
.crop-h-br{right:-7px;bottom:-7px;cursor:nwse-resize;}
.crop-h-t{left:50%;top:-7px;transform:translateX(-50%);cursor:ns-resize;}
.crop-h-b{left:50%;bottom:-7px;transform:translateX(-50%);cursor:ns-resize;}
.crop-h-l{left:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize;}
.crop-h-r{right:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize;}
.editor-controls{width:100%;display:flex;flex-direction:column;gap:12px;}
.editor-ctl{display:flex;align-items:center;gap:12px;}
.editor-ctl-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-2);width:70px;flex-shrink:0;}
.editor-ctl input[type=range]{flex:1;accent-color:var(--accent);}
.editor-btns{display:flex;gap:7px;flex-wrap:wrap;}
.editor-tip{margin:0;font-size:11.5px;color:var(--text-3);text-align:center;}

/* ===================== TOASTS ===================== */
.toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:200;}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-lg);
  font-size:13.5px;font-weight:500;border-left:3px solid var(--text-3);animation:toastin .2s cubic-bezier(.2,.8,.3,1);min-width:240px;max-width:380px;}
@keyframes toastin{from{opacity:0;transform:translateX(20px);}}
.toast-success{border-left-color:var(--success);} .toast-success svg{color:var(--success);}
.toast-danger{border-left-color:var(--danger);} .toast-danger svg{color:var(--danger);}
.toast-warning{border-left-color:var(--warning);} .toast-warning svg{color:var(--warning);}

/* ===================== CATÁLOGOS: CLIENTES ===================== */
.cliente-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px;}
.cliente-card{display:flex;flex-direction:column;gap:5px;text-align:left;padding:16px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow-sm);transition:.14s;}
.cliente-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.cliente-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.cliente-avatar{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.cliente-avatar.lg{width:46px;height:46px;font-size:15px;border-radius:11px;}
.cliente-nro{font-size:12px;color:var(--text-4);font-weight:600;}
.cliente-name{margin:0;font-size:14.5px;font-weight:600;line-height:1.3;}
.cliente-fantasia{font-size:12px;color:var(--text-3);}
.cliente-stats{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:9px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-2);}
.cliente-stats strong{color:var(--accent);font-weight:700;}
.cliente-detail-head{display:flex;align-items:center;gap:13px;}
.cliente-detail-head h3{margin:0 0 1px;font-size:16px;font-weight:600;}
.modal-form{padding:18px 22px 4px;}
.cliente-ots-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;font-size:13px;font-weight:600;}
.cliente-ots{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto;}
.cliente-ot-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);text-align:left;transition:.12s;}
.cliente-ot-row:hover{border-color:var(--accent);background:var(--accent-soft);}
.cliente-ot-muestra{flex:1;font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ===================== CATÁLOGOS: EQUIPOS ===================== */
.danger-banner{background:var(--danger-soft);color:var(--danger);border-color:#f0c5c0;}
.equipo-row td{vertical-align:middle;}
.danger-text{color:var(--danger);font-weight:600;}

/* ===================== CATÁLOGOS: NORMAS ===================== */
.norma-card{padding:20px;}
.norma-table{width:100%;border-collapse:collapse;}
.norma-table th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);padding:8px 10px;border-bottom:1px solid var(--border);}
.norma-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.norma-table tbody tr:last-child td{border-bottom:none;}
.norma-table tbody tr:hover{background:var(--surface-2);}
.norma-code{font-weight:600;font-size:13px;color:var(--accent);}
.norma-title{font-size:13px;color:var(--text-2);}

/* ===================== COMBO / CALIB BADGE / FILTER ===================== */
.combo-input{position:relative;}
.combo-input .input{padding-right:30px;}
.combo-chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
.combo-input .input::-webkit-calendar-picker-indicator{opacity:0;}
.calib-badge{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:6px;width:fit-content;}
.calib-success{background:var(--success-soft);color:var(--success);}
.calib-warning{background:var(--warning-soft);color:var(--warning);}
.calib-danger{background:var(--danger-soft);color:var(--danger);}
.filter-sub{display:flex;align-items:center;gap:8px;}
.filter-chip{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);padding:3px 4px 3px 11px;border-radius:20px;font-size:12.5px;}
.filter-chip-x{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:none;background:rgba(30,96,145,.16);color:var(--accent);border-radius:50%;}
.filter-chip-x:hover{background:var(--accent);color:#fff;}
.link-btn{display:inline-flex;align-items:center;gap:5px;border:none;background:transparent;color:var(--accent);font-weight:600;font-size:12.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}

/* ===================== REPORT PREVIEW ===================== */
.modal:has(.report-prev-body){max-width:860px;display:flex;flex-direction:column;max-height:92vh;}
.report-prev-head{align-items:flex-start;}
.report-prev-head h3{margin:0 0 1px;}
.report-prev-body{overflow-y:auto;padding:20px 24px;background:var(--surface-3);display:flex;flex-direction:column;gap:18px;}
.report-prev-actions{flex-shrink:0;border-top:1px solid var(--border);}
.rp-page{position:relative;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-md);border-radius:3px;
  padding:42px 46px 34px;min-height:560px;overflow:hidden;font-size:12.5px;color:#222;}
.rp-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-32deg);font-size:88px;font-weight:800;
  letter-spacing:.06em;color:rgba(180,83,9,.10);pointer-events:none;white-space:nowrap;z-index:0;}
.rp-page > *{position:relative;z-index:1;}
.rp-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--accent);margin-bottom:24px;}
.rp-header.small{border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:20px;}
.rp-logo{height:38px;width:auto;}
.rp-logo.sm{height:26px;}
.rp-header-meta{display:flex;flex-direction:column;text-align:right;font-size:11px;color:var(--text-3);line-height:1.45;}
.rp-titleblock{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:26px;}
.rp-titleblock h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.04em;color:#1a1d23;}
.rp-otnum{font-size:14px;font-weight:600;color:var(--accent);}
.rp-datagrid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:5px;overflow:hidden;margin-bottom:20px;}
.rp-datarow{display:flex;flex-direction:column;gap:1px;padding:9px 13px;border-bottom:1px solid var(--border);}
.rp-datarow:nth-child(odd){border-right:1px solid var(--border);}
.rp-datarow:nth-last-child(-n+2){border-bottom:none;}
.rp-datak{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-4);}
.rp-datav{font-size:13px;font-weight:500;color:#222;}
.rp-label{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-4);margin-bottom:6px;}
.rp-muestra{margin-bottom:20px;}
.rp-muestra pre{margin:0;font-family:var(--mono);font-size:12px;line-height:1.6;color:#333;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:11px 13px;white-space:pre-wrap;}
.rp-photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.rp-photo-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--border);}
.rp-photo-empty{font-size:12px;color:var(--text-4);font-style:italic;padding:14px;text-align:center;border:1px dashed var(--border-strong);border-radius:5px;}
.rp-foot{position:absolute;left:46px;right:46px;bottom:18px;display:flex;justify-content:space-between;font-size:10px;color:var(--text-4);border-top:1px solid var(--border);padding-top:8px;z-index:1;}
.rp-ensayo-title{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:700;margin:0 0 18px;color:#1a1d23;}
.rp-ensayo-n{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.rp-params{display:grid;grid-template-columns:1fr 1fr;gap:7px 22px;margin-bottom:20px;}
.rp-param{display:flex;justify-content:space-between;gap:12px;padding-bottom:6px;border-bottom:1px dotted var(--border-strong);}
.rp-param-k{color:var(--text-3);font-size:12px;}
.rp-param-v{font-weight:600;color:#222;font-size:12px;text-align:right;}
.rp-table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:11.5px;}
.rp-table th{background:var(--accent);color:#fff;font-weight:600;text-align:left;padding:7px 9px;font-size:10.5px;white-space:nowrap;}
.rp-table td{padding:6px 9px;border:1px solid var(--border);color:#333;}
.rp-table tbody tr:nth-child(even){background:var(--surface-2);}
.rp-table td.rp-ok{color:var(--success);font-weight:600;}
.rp-table td.rp-bad{color:var(--danger);font-weight:600;}
.rp-result-line{display:flex;flex-direction:column;gap:4px;margin-bottom:18px;padding:12px 14px;background:var(--success-soft);border-radius:6px;}
.rp-result-line strong{font-size:14px;color:#1a1d23;}
.rp-obs{margin-bottom:18px;}
.rp-obs p{margin:0;font-size:12px;line-height:1.55;color:#444;}

/* ===================== ENSAYO DRAG + DUPLICAR ===================== */
.ensayo-list-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-4);margin:0 0 4px;}
.ensayo-grip{display:flex;align-items:center;color:var(--text-4);cursor:grab;margin-left:-3px;flex-shrink:0;}
.ensayo-grip:active{cursor:grabbing;}
.ensayo-item.dragging{opacity:.45;border-color:var(--accent);}
.ensayo-item.drop-over{border-color:var(--accent);box-shadow:0 -2px 0 var(--accent) inset;background:var(--accent-soft);}
.dup-intro{font-size:13px;color:var(--text-2);line-height:1.5;margin:0 0 16px;}
.dup-opts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.dup-trello{margin:0 0 14px;padding:12px 14px;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius);}
.dup-trello-label{display:block;font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.dup-opt{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);cursor:pointer;}
.dup-opt input{display:none;}
.dup-opt input:checked + .pre-toggle-box{background:var(--accent);border-color:var(--accent);}

/* ===================== SKELETON ===================== */
.skel{background:linear-gradient(90deg,var(--surface-3) 25%,#e9ebef 37%,var(--surface-3) 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
.skel-mt{margin-top:5px;}
.skel-card{cursor:default;gap:8px;}
.skel-card:hover{transform:none;box-shadow:var(--shadow-sm);border-color:var(--border);}
.skel-row td{padding:14px 16px;border-bottom:1px solid var(--border);}

/* ===================== TIMELINE ===================== */
.timeline{display:flex;flex-direction:column;position:relative;padding-left:4px;}
.tl-item{display:flex;gap:12px;position:relative;padding-bottom:16px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:11px;top:22px;bottom:-2px;width:1.5px;background:var(--border);}
.tl-item:last-child::before{display:none;}
.tl-dot{width:23px;height:23px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1;border:2px solid var(--surface);}
.tl-body{display:flex;flex-direction:column;gap:1px;padding-top:1px;}
.tl-text{font-size:13px;font-weight:500;color:var(--text);line-height:1.35;}
.tl-date{font-size:11.5px;color:var(--text-4);font-family:var(--mono);}

/* ===================== URGENCIA EQUIPOS ===================== */
.urgencia-block{margin-bottom:18px;}
.urgencia-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:10px;}
.urgencia-head .dim{margin-left:auto;font-weight:400;}
.urgencia-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.urg-card{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 16px;border:1px solid var(--border);border-left-width:4px;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);transition:.14s;}
.urg-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.urg-vencido{border-left-color:var(--danger);}
.urg-porvencer{border-left-color:var(--warning);}
.urg-count{display:flex;align-items:baseline;gap:6px;margin-bottom:2px;}
.urg-num{font-size:28px;font-weight:700;font-family:var(--mono);line-height:1;letter-spacing:-.02em;}
.urg-vencido .urg-num{color:var(--danger);}
.urg-porvencer .urg-num{color:var(--warning);}
.urg-unit{font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.03em;}
.urg-name{font-size:12.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.urg-cert{font-size:11px;color:var(--text-3);}
.calib-cell{display:flex;align-items:center;gap:8px;}
.calib-count{font-size:11px;font-weight:600;font-family:var(--mono);}
.cc-bad{color:var(--danger);} .cc-warn{color:var(--warning);}

/* ===================== ENTRANCE ANIMATIONS ===================== */
@media (prefers-reduced-motion:no-preference){
  @keyframes riseIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  .card,.cliente-card,.urg-card,.ot-table .ot-row,.stat-cards > *,.ensayo-item{animation:riseIn .34s cubic-bezier(.2,.7,.3,1) backwards;}
  .stat-cards > *:nth-child(1){animation-delay:.02s;}
  .stat-cards > *:nth-child(2){animation-delay:.06s;}
  .stat-cards > *:nth-child(3){animation-delay:.10s;}
  .stat-cards > *:nth-child(4){animation-delay:.14s;}
  .stat-cards > *:nth-child(5){animation-delay:.18s;}
  .ot-table tbody .ot-row:nth-child(1){animation-delay:.02s;}
  .ot-table tbody .ot-row:nth-child(2){animation-delay:.05s;}
  .ot-table tbody .ot-row:nth-child(3){animation-delay:.08s;}
  .ot-table tbody .ot-row:nth-child(4){animation-delay:.11s;}
  .ot-table tbody .ot-row:nth-child(5){animation-delay:.14s;}
  .ot-table tbody .ot-row:nth-child(6){animation-delay:.17s;}
  .ot-table tbody .ot-row:nth-child(n+7){animation-delay:.19s;}
  .skel-row{animation:none;}
}

/* ===================== STAT CARDS ===================== */
.stat-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
.stat-card{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);transition:.14s;cursor:pointer;}
.stat-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.stat-card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.stat-card-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:3px;}
.stat-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.stat-go{color:var(--text-4);}
.stat-value{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1;font-family:var(--mono);}
.stat-label{font-size:12px;color:var(--text-3);font-weight:500;}
.stat-accent .stat-ic{background:var(--accent-soft);color:var(--accent);}
.stat-neutral .stat-ic{background:var(--surface-3);color:var(--text-2);}
.stat-info .stat-ic{background:var(--info-soft);color:var(--info);}
.stat-success .stat-ic{background:var(--success-soft);color:var(--success);}
.stat-danger .stat-ic{background:var(--danger-soft);color:var(--danger);}
.stat-danger .stat-value{color:var(--danger);}
.stat-link:hover{border-color:var(--accent);}
@media (max-width:1180px){.stat-cards{grid-template-columns:repeat(3,1fr);}}

/* ===================== VALIDACIÓN TABLA ===================== */
.dt-input.invalid{border-color:var(--danger)!important;background:var(--danger-soft);box-shadow:0 0 0 1px var(--danger) inset;}
.dt-select.invalid{outline:1px solid var(--danger);border-radius:5px;background:var(--danger-soft);}
.results-sec.has-error{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger-soft);}
.results-error{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--danger);}

@media (max-width:1180px){
  .detail-grid{grid-template-columns:1fr;}
  .detail-right{position:static;}
}
</style>

<script>
  // Aplicar tema oscuro/claro ANTES de renderizar para evitar flash.
  // El toggle (en el sidebar) lee y escribe la misma key.
  (function () {
    try {
      var t = localStorage.getItem('lab-theme') || 'light';
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
    window.LabTheme = {
      get: function () {
        try { return localStorage.getItem('lab-theme') || 'light'; } catch (e) { return 'light'; }
      },
      set: function (t) {
        try { localStorage.setItem('lab-theme', t); } catch (e) {}
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
      },
      toggle: function () {
        var next = (window.LabTheme.get() === 'dark') ? 'light' : 'dark';
        window.LabTheme.set(next);
        return next;
      }
    };
  })();
</script>
